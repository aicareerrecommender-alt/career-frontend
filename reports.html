<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Reports | CareerPath AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        body {
            background-color: #f7fbff;
            font-family: 'Inter', sans-serif; 
        }
        
        /* Sidebar Styles (Matching index.html) */
        .sidebar {
            height: 100vh; 
            background: #ecfdf5;
            color: #0f172a;
            position: fixed; 
            width: 280px; 
            z-index: 1000;
            transition: transform 0.3s ease-in-out;
        }
        .sidebar .text-white { color: #1d4ed8 !important; }
        .sidebar .text-info { color: #059669 !important; }
        .nav-link { 
            color: #64748b;
            transition: 0.3s; 
            margin-bottom: 5px; 
            border-radius: 8px; 
            font-weight: 500;
        }
        .nav-link:hover, .nav-link.active {
            color: #1d4ed8;
            background: #d1fae5;
        }
        .main-content { 
            margin-left: 280px; 
            padding: 40px; 
        }

        /* Inbox Styling */
        .inbox-container { 
            background: white; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .inbox-header {
            background-color: #f7fbff;
            border-bottom: 1px solid #d1e4f5;
            padding: 15px 20px;
            font-weight: 600;
            color: #64748b;
            display: flex;
        }
        .inbox-row { 
            display: flex; 
            align-items: center; 
            padding: 16px 20px; 
            border-bottom: 1px solid #d1e4f5;
            cursor: pointer; 
            transition: background 0.2s;
        }
        .inbox-row:hover { 
            background-color: #f0fdf4;
            box-shadow: inset 4px 0 0 #059669;
        }
        .inbox-row:last-child { border-bottom: none; }
        
        /* Columns */
        .star-col { width: 40px; color: #cbd5e1; }
        .inbox-row:hover .star-col { color: #f59e0b; }
        .course-col { flex: 1; min-width: 0; padding-right: 20px;}
        .level-col { width: 120px; text-align: right; padding-right: 20px; } /* New column for the badge */
        .date-col { width: 100px; text-align: right; color: #64748b; font-size: 0.85rem; font-weight: 500;}
        .download-col { width: 48px; text-align: center; }
        .download-report-button { width: 34px; height: 34px; padding: 0; }
        
        .course-title { font-weight: 600; color: #0f172a; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .course-subtitle { font-size: 0.85rem; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        
        .level-badge { font-size: 0.75rem; padding: 5px 10px; }

        .reports-menu-toggle,
        .sidebar-overlay {
            display: none;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                width: min(280px, calc(100vw - 56px));
                height: 100vh;
                height: 100dvh;
                z-index: 1050;
                transform: translateX(-100%);
            }
            .sidebar.show-mobile {
                transform: translateX(0);
                box-shadow: 4px 0 15px rgba(0,0,0,0.2);
            }
            .main-content { width: 100%; margin-left: 0; padding: 20px; }
            .reports-menu-toggle { display: inline-flex; flex: 0 0 auto; }
            .reports-heading-group { display: flex; align-items: flex-start; gap: 12px; min-width: 0; }
            .reports-heading-group > div { min-width: 0; }
            .sidebar-overlay {
                position: fixed;
                inset: 0;
                z-index: 1040;
                background: rgba(15, 23, 42, 0.45);
            }
            .sidebar-overlay.show { display: block; }
            body.reports-sidebar-open { overflow: hidden; }
            .date-col, .level-col { display: none; }
        }
    </style><link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d4ed8">
<link rel="apple-touch-icon" href="icons/careerpath-logo.png?v=20261107-7">
</head>
<body>

<div id="main-app">
    <div id="reports-sidebar" class="sidebar d-flex flex-column p-4 shadow-lg">
        <h4 class="fw-bold mb-4 text-white"><i class="fas fa-brain me-2 text-info"></i>CareerPath AI</h4>
        
        <ul class="nav flex-column mb-auto">
            <li class="nav-item">
                <a href="index.html" class="nav-link">
                    <i class="fas fa-home me-3"></i>Dashboard Home
                </a>
            </li>
            <li class="nav-item mt-2">
                <a href="#" class="nav-link active d-flex justify-content-between align-items-center">
                    <span><i class="fas fa-folder-open me-3"></i>Saved Reports</span>
                    <span class="badge bg-info rounded-pill text-dark" id="reportCountBadge">0</span>
                </a>
            </li>
        </ul>

        <div class="mt-4 pt-3 border-top border-secondary text-center text-secondary small">
            Logged in as: <strong id="sidebar-user" class="text-light"></strong>
        </div>
    </div>

    <div id="sidebar-overlay" class="sidebar-overlay" aria-hidden="true" onclick="closeReportsSidebar()"></div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center gap-3 mb-4">
            <div class="reports-heading-group">
                <button id="reports-sidebar-toggle" class="btn btn-outline-primary border-0 reports-menu-toggle" type="button" aria-label="Open navigation menu" aria-controls="reports-sidebar" aria-expanded="false" onclick="toggleReportsSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
                <div>
                <h2 class="fw-bold text-dark"><i class="fas fa-inbox text-primary me-2"></i>Intelligence Archive</h2>
                <p class="text-secondary">Review your previously generated career recommendations.</p>
                </div>
            </div>
            <a href="index.html" class="btn btn-primary shadow-sm px-4 rounded-3">
                <i class="fas fa-plus me-2"></i> New Analysis
            </a>
        </div>

        <div class="inbox-container shadow-sm" id="inboxList">
            <div class="inbox-header">
                <div class="star-col"></div>
                <div class="course-col">Report Details</div>
                <div class="level-col">Academic Tier</div>
                <div class="date-col">Date</div>
            </div>
            
            <div class="p-5 text-center text-muted" id="loadingState">
                <div class="spinner-border text-primary mb-3" role="status"></div>
                <p>Fetching your reports...</p>
            </div>
            
            <div id="reportsContainer"></div>
        </div>
    </div>
</div>

<div class="modal fade" id="reportViewModal" tabindex="-1" aria-labelledby="reportModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header bg-light border-0 pb-3 d-flex justify-content-between align-items-center">
                <h5 class="modal-title fw-bold text-dark" id="reportModalLabel"><i class="fas fa-file-alt text-primary me-2"></i> Report Summary</h5>
                <div class="d-flex align-items-center">
                    <button type="button" class="btn btn-primary btn-sm me-3 shadow-sm px-3 rounded-3" onclick="downloadSavedPDF()">
                        <i class="fas fa-file-pdf text-danger me-1"></i> Download PDF
                    </button>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
            </div>
            <div class="modal-body p-4" id="modalContent">
                </div>
            <div class="modal-footer border-0 bg-light">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close Archive</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_URL = "https://career-backend-zz4g.onrender.com";
    let currentUser = "";
    let globalReports = []; 
    let currentViewedReport = null; // Track which report is open for PDF generation

    function toggleReportsSidebar() {
        const sidebar = document.getElementById("reports-sidebar");
        const overlay = document.getElementById("sidebar-overlay");
        const toggle = document.getElementById("reports-sidebar-toggle");
        const isOpen = sidebar.classList.toggle("show-mobile");
        overlay.classList.toggle("show", isOpen);
        overlay.setAttribute("aria-hidden", String(!isOpen));
        toggle.setAttribute("aria-expanded", String(isOpen));
        toggle.setAttribute("aria-label", isOpen ? "Close navigation menu" : "Open navigation menu");
        document.body.classList.toggle("reports-sidebar-open", isOpen);
    }

    function closeReportsSidebar() {
        const sidebar = document.getElementById("reports-sidebar");
        const overlay = document.getElementById("sidebar-overlay");
        const toggle = document.getElementById("reports-sidebar-toggle");
        sidebar.classList.remove("show-mobile");
        overlay.classList.remove("show");
        overlay.setAttribute("aria-hidden", "true");
        toggle.setAttribute("aria-expanded", "false");
        toggle.setAttribute("aria-label", "Open navigation menu");
        document.body.classList.remove("reports-sidebar-open");
    }

    document.addEventListener("keydown", event => {
        if (event.key === "Escape") closeReportsSidebar();
    });

    window.addEventListener("resize", () => {
        if (window.innerWidth > 768) closeReportsSidebar();
    });

    window.onload = () => {
        const savedUser = localStorage.getItem('user_name');
        if (!savedUser) {
            window.location.href = "login.html"; 
            return;
        }
        currentUser = savedUser;
        document.getElementById("sidebar-user").innerText = currentUser;
        fetchHistory();
    };

    async function fetchHistory() {
        try {
            const response = await fetch(`${API_URL}/history?username=${encodeURIComponent(currentUser)}`);
            const data = await response.json();
            
            globalReports = data.reverse(); 
            document.getElementById('reportCountBadge').innerText = globalReports.length;
            
            renderInbox(globalReports);
        } catch (error) {
            console.error("Error fetching history:", error);
            document.getElementById('loadingState').innerHTML = `
                <div class="text-danger"><i class="fas fa-exclamation-triangle fa-2x mb-3"></i><br>Failed to load reports. Please ensure backend is running.</div>
            `;
        }
    }

    function renderInbox(reports) {
        document.getElementById('loadingState').style.display = 'none';
        const container = document.getElementById('reportsContainer');
        
        if (!reports || reports.length === 0) {
            container.innerHTML = `
                <div class="p-5 text-center text-muted">
                    <i class="fas fa-folder-open fa-3x mb-3 opacity-50"></i>
                    <h5>Your archive is empty</h5>
                    <p>Run a new analysis to see your saved reports here.</p>
                </div>
            `;
            return;
        }

        container.innerHTML = reports.map((item, index) => {
            const dateStr = item.timestamp ? new Date(item.timestamp).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : 'Unknown Date';
            // Handle structure whether it's wrapped in ai_response or flat
            const aiResults = item.ai_response || item;
            const courseName = aiResults.specific_course || aiResults.course || 'Career Recommendation';
            const level = aiResults.level || 'Degree';
            const role = aiResults.ai_role || 'General Path';
            const uniCount = aiResults.universities ? aiResults.universities.length : 0;

            return `
                <div class="inbox-row" onclick="viewReport(${index})">
                    <div class="star-col"><i class="far fa-star"></i></div>
                    <div class="course-col">
                        <div class="course-title">${courseName}</div>
                        <div class="course-subtitle">
                            Target Role: <strong>${role}</strong> • Matches ${uniCount} Universities
                        </div>
                    </div>
                    <div class="level-col">
                        <span class="badge bg-primary-subtle text-primary border border-primary-subtle rounded-pill level-badge">${level}</span>
                    </div>
                    <div class="date-col">${dateStr}</div>
                    <div class="download-col">
                        <button type="button" class="btn btn-light border download-report-button rounded-circle" title="Download PDF" aria-label="Download ${courseName} report as PDF" onclick="event.stopPropagation(); downloadArchivedReport(${index}, this)">
                            <i class="fas fa-download text-primary"></i>
                        </button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function viewReport(index) {
        currentViewedReport = globalReports[index];
        const data = currentViewedReport.ai_response || currentViewedReport;
        const reportMetadata = currentViewedReport.report_metadata || data.report_metadata || {};
        
        const modal = new bootstrap.Modal(document.getElementById('reportViewModal'));
        
        let roadmapHtml = data.ai_roadmap 
            ? data.ai_roadmap.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>') 
            : "No specific action plan saved.";

        const reasonHtml = data.interest_match_reason
            ? `<div class="p-3 my-3 rounded border bg-light"><strong>Why this fits your needs</strong><p class="mb-0 mt-2">${escapeReportHtml(data.interest_match_reason)}</p></div>`
            : "";
        let admissionHtml = "";
        const admissionRecords = Array.isArray(data.admission_requirements?.records)
            ? data.admission_requirements.records
            : [];
        if (admissionRecords.length) {
            admissionHtml = `<h6 class="fw-bold mt-4"><i class="fas fa-list-check me-2 text-primary"></i>Eligibility and historical cutoffs</h6>`;
            admissionRecords.slice(0, 8).forEach(record => {
                const requirementLines = (record.requirements || []).map(group => {
                    const subjects = (group.subjects || []).join(" or ");
                    return `${subjects}: minimum ${group.minimum_grade || "not specified"} · ${group.status || "Not assessed"}`;
                }).join("<br>");
                const cutoffSourceUrl = getOfficialKuccpsCutoffUrl(record.kuccps_cutoff);
                const cutoffSourceLink = cutoffSourceUrl
                    ? `<br><a href="${escapeReportHtml(cutoffSourceUrl)}" target="_blank" rel="noopener noreferrer">Open official KUCCPS cutoff PDF</a>`
                    : "";
                const applicationUrl = getVerifiedApplicationUrl(
                    record.application_url,
                    record.application_url_verified,
                );
                const applicationLink = applicationUrl
                    ? `<br><a href="${escapeReportHtml(applicationUrl)}" target="_blank" rel="noopener noreferrer">Apply through the official portal</a>`
                    : "";
                admissionHtml += `<div class="border rounded-3 p-3 mb-2"><strong>${escapeReportHtml(record.institution || "Institution")}</strong><br><small>${escapeReportHtml(record.course || "")}</small><br><small class="text-primary">${escapeReportHtml(formatKuccpsCutoff(record.kuccps_cutoff))}</small>${cutoffSourceLink}${applicationLink}${requirementLines ? `<div class="small mt-2">${escapeReportHtml(requirementLines).replace(/&lt;br&gt;/g, "<br>")}</div>` : ""}</div>`;
            });
        }

        let uniHtml = "";
        if (data.universities && data.universities.length > 0) {
            uniHtml = `<h6 class="fw-bold mt-4"><i class="fas fa-university me-2 text-primary"></i>Top Institutional Matches:</h6><ul class="list-group mb-3">`;
            data.universities.slice(0, 3).forEach(u => {
                const applicationUrl = getVerifiedApplicationUrl(
                    u.application_url,
                    u.application_url_verified,
                );
                const applicationLink = applicationUrl
                    ? `<br><a href="${escapeReportHtml(applicationUrl)}" target="_blank" rel="noopener noreferrer">Apply through the official portal</a>`
                    : "";
                uniHtml += `<li class="list-group-item bg-light border-0 mb-1 rounded"><strong>${u.name}</strong><br><small class="text-muted">${u.reason}</small><br><small class="text-primary">${formatKuccpsCutoff(u.kuccps_cutoff)}</small>${applicationLink}</li>`;
            });
            uniHtml += `</ul>`;
        }
        const reportContextHtml = reportMetadata.student_request
            ? `<div class="alert alert-light border small"><strong>Prepared for your request:</strong> ${escapeReportHtml(reportMetadata.student_request)}<br><strong>Grade profile:</strong> ${escapeReportHtml(reportMetadata.grade_status || "not provided")}${reportMetadata.aggregate_points != null ? ` · ${reportMetadata.aggregate_points}/84 points` : ""}<br><span class="text-muted">${escapeReportHtml(reportMetadata.assessment_note || "")}</span></div>`
            : "";

        document.getElementById('modalContent').innerHTML = `
            <div class="mb-3">
                <span class="badge bg-warning text-dark mb-2 px-3 py-2 rounded-pill"><i class="fas fa-star me-1"></i> SAVED MATCH</span>
                <h3 class="fw-bold text-dark mb-1">${data.specific_course || data.course}</h3>
                <h6 class="text-secondary">Target Role: ${data.ai_role}</h6>
            </div>
            ${reportContextHtml}
            ${reasonHtml}
            <hr class="text-muted my-4">
            <h6 class="fw-bold text-dark mb-3"><i class="fas fa-map-signs text-primary me-2"></i> AI Action Plan</h6>
            <div class="bg-white p-4 rounded-3 border shadow-sm text-secondary" style="line-height: 1.8; font-size: 0.95rem;">
                ${roadmapHtml}
            </div>
            ${uniHtml}
            ${admissionHtml}
        `;
        
        modal.show();
    }

    function escapeReportHtml(value) {
        const element = document.createElement('span');
        element.textContent = String(value || "");
        return element.innerHTML;
    }

    function getOfficialKuccpsCutoffUrl(cutoff) {
        try {
            const url = new URL(cutoff?.source_url || "");
            return url.protocol === "https:" && url.hostname === "statics.kuccps.net"
                ? url.href
                : "";
        } catch (error) {
            console.warn("An invalid KUCCPS cutoff source URL was excluded.");
            return "";
        }
    }

    function getVerifiedApplicationUrl(applicationUrl, isVerified) {
        if (isVerified !== true || typeof applicationUrl !== "string") return "";
        try {
            const url = new URL(applicationUrl);
            return url.protocol === "https:"
                && url.hostname
                && !url.username
                && !url.password
                && (!url.port || url.port === "443")
                ? url.href
                : "";
        } catch (error) {
            console.warn("An invalid official application URL was excluded.");
            return "";
        }
    }

    function kuccpsCutoffRetrievalLabel(cutoff) {
        if (cutoff?.retrieval_status === "online") {
            const retrievedAt = cutoff.retrieved_at ? new Date(cutoff.retrieved_at) : null;
            const checkedDate = retrievedAt && !Number.isNaN(retrievedAt.getTime())
                ? ` on ${retrievedAt.toLocaleDateString('en-GB')}`
                : "";
            return `fetched from the official KUCCPS online source${checkedDate}`;
        }
        if (cutoff?.retrieval_status === "stale_online_cache") {
            return "using the last successful online snapshot because the latest refresh failed";
        }
        if (cutoff?.retrieval_status === "offline_snapshot") {
            return "using the bundled offline snapshot because the online source was unavailable";
        }
        return "source retrieval status not recorded";
    }

    function formatKuccpsCutoff(cutoff) {
        const record = Array.isArray(cutoff?.records)
            ? cutoff.records.find(item => item && item.latest)
            : null;
        if (cutoff === undefined) return "";
        if (cutoff === null) return "No historical KUCCPS cutoff matched for this institution and course.";
        if (!record) return "The programme is listed, but no numeric historical cutoff is available.";
        const publishedThrough = cutoff.latest_published_cutoff_year || record.latest.year;
        return `Latest published KUCCPS cutoff: ${record.latest.points} cluster points (${record.latest.year}); ${cutoff.source || 'KUCCPS programme cutoffs'}, PDF page ${record.source_page || 'not listed'}; ${kuccpsCutoffRetrievalLabel(cutoff)}. This source has cutoff data through ${publishedThrough}, not necessarily the current admission cycle, and the values do not guarantee admission.`;
    }

    // --- PDF GENERATION ENGINE FOR SAVED REPORTS ---
    function buildPDFDocument(aiResults, fullLogItem) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const studentName = currentUser || "Student";
        // Extract points from the root log item or the ai_results
        const reportMetadata = fullLogItem.report_metadata || aiResults.report_metadata || {};
        const aggPoints = fullLogItem.points || reportMetadata.aggregate_points || aiResults.validated_points;

        doc.setFillColor(79, 70, 229); 
        doc.rect(0, 0, 210, 40, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(22);
        doc.text("KUCCPS Smart Placement Report", 14, 25);
        doc.setFontSize(10);
        
        const dateText = fullLogItem.timestamp ? new Date(fullLogItem.timestamp).toLocaleDateString() : new Date().toLocaleDateString();
        doc.text(`Archive Date: ${dateText}`, 150, 25);

        doc.setTextColor(0, 0, 0);
        doc.setFontSize(12);
        doc.text(`Name: ${studentName}`, 14, 50);
        doc.text(
            aggPoints != null
                ? `Aggregate Points: ${aggPoints}`
                : `Grade profile: ${reportMetadata.grade_status || "Retrieved from Archive"}`,
            14,
            57
        );

        let currentY = 70; 
        doc.setFillColor(240, 245, 255);
        doc.rect(14, currentY, 182, 30, 'F');
        doc.setFontSize(14);
        doc.setTextColor(0, 51, 102);
        const mainPath = aiResults.specific_course || aiResults.course || aiResults.career_path || aiResults.ai_role;
        doc.text(`Recommended Path: ${mainPath} (${aiResults.level || "Degree"})`, 18, currentY + 12);
        doc.setFontSize(12);
        doc.text(`Target Role: ${aiResults.ai_role}`, 18, currentY + 22);
        currentY += 40;
        if (reportMetadata.student_request) {
            doc.setFontSize(10);
            doc.setTextColor(60, 60, 60);
            const requestLines = doc.splitTextToSize(`Prepared for: ${reportMetadata.student_request}`, 182);
            doc.text(requestLines, 14, currentY);
            currentY += requestLines.length * 5 + 4;
        }

        if (aiResults.ai_roadmap) {
            doc.setFontSize(13);
            doc.setTextColor(0, 0, 0);
            doc.setFont("helvetica", "bold");
            doc.text("Your Action Plan:", 14, currentY);
            let cleanRoadmap = aiResults.ai_roadmap.replace(/<br\s*[\/]?>/gi, "\n").replace(/<li>/gi, "\n • ").replace(/<\/li>/gi, "").replace(/<[^>]*>?/gm, "").replace(/&nbsp;/g, " ").trim();
            doc.setFontSize(11);
            doc.setTextColor(60, 60, 60);
            doc.setFont("helvetica", "normal");
            const splitRoadmap = doc.splitTextToSize(cleanRoadmap, 182);
            doc.text(splitRoadmap, 14, currentY + 8);
            currentY += 15 + (splitRoadmap.length * 5); 
        }

        if (aiResults.universities && aiResults.universities.length > 0) {
            doc.setFontSize(12);
            doc.setTextColor(0, 0, 0);
            doc.setFont("helvetica", "bold"); 
            doc.text("Verified Institutional Pathways:", 14, currentY);
            doc.setFont("helvetica", "normal"); 
            const tableData = aiResults.universities.map(u => {
                const reqSummary = u.requirements_met ? u.requirements_met.map(r => `${r.subject}: ${r.attained} (Req: ${r.required})`).join("\n") : "Standard Entry Met";
                return [u.name, u.specific_course || u.course || u.course_name || "Recommended Degree", formatKuccpsCutoff(u.kuccps_cutoff), reqSummary, u.reason];
            });
            doc.autoTable({ startY: currentY + 5, head: [['Institution', 'Verified Course', 'Historical cutoff', 'Requirement Check', 'Reason']], body: tableData, theme: 'grid', headStyles: { fillColor: [79, 70, 229] }, columnStyles: { 0: { cellWidth: 32 }, 1: { cellWidth: 34 }, 2: { cellWidth: 36 }, 3: { cellWidth: 38 }, 4: { cellWidth: 42 } }, styles: { fontSize: 8, cellPadding: 3 } });
        }

        let finalY = doc.lastAutoTable ? doc.lastAutoTable.finalY + 15 : currentY + 20;
        if (finalY > 250) { doc.addPage(); finalY = 20; }

        if (aiResults.alternative_careers && aiResults.alternative_careers.length > 0) {
            doc.setFontSize(12);
            doc.setTextColor(0, 0, 0);
            doc.setFont("helvetica", "bold");
            doc.text("Alternative Career Pathways:", 14, finalY);
            doc.setFont("helvetica", "normal");
            const altTableData = aiResults.alternative_careers.map(alt => [alt.name, alt.reason]);
            doc.autoTable({ startY: finalY + 5, head: [['Backup Career', 'Why this is a good fit']], body: altTableData, theme: 'grid', headStyles: { fillColor: [255, 193, 7], textColor: [0, 0, 0] }, styles: { fontSize: 9, cellPadding: 4 } });
        }
        return doc;
    }

    function makeReportFileName(report, suffix = "Saved_Placement_Report") {
        const aiResults = report?.ai_response || report || {};
        const path = aiResults.specific_course || aiResults.course || aiResults.ai_role || suffix;
        const safePath = String(path).replace(/[^a-z0-9]+/gi, "_").replace(/^_|_$/g, "").slice(0, 50);
        const studentName = String(currentUser || "Student").replace(/[^a-z0-9]+/gi, "_").replace(/^_|_$/g, "") || "Student";
        return `${studentName}_${safePath || suffix}.pdf`;
    }

    function downloadArchivedReport(index, button = null) {
        const report = globalReports[index];
        if (!report) { alert("Error loading report data."); return; }
        const aiResults = report.ai_response || report;
        const originalHtml = button?.innerHTML;
        if (button) { button.disabled = true; button.innerHTML = `<span class="spinner-border spinner-border-sm"></span>`; }
        try {
            if (!window.jspdf) throw new Error("PDF library is unavailable");
            const doc = buildPDFDocument(aiResults, report);
            doc.save(makeReportFileName(report));
        } catch (error) {
            console.error("Report download failed:", error);
            alert("The report could not be downloaded. Please try again.");
        } finally {
            if (button) { button.disabled = false; button.innerHTML = originalHtml; }
        }
    }

    function downloadSavedPDF() {
        if (!currentViewedReport) { alert("Error loading report data."); return; }
        const aiResults = currentViewedReport.ai_response || currentViewedReport;
        const btn = document.querySelector('button[onclick="downloadSavedPDF()"]');
        const originalHtml = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Generating...`;
        setTimeout(() => {
            try {
                if (!window.jspdf) throw new Error("PDF library is unavailable");
                const doc = buildPDFDocument(aiResults, currentViewedReport);
                doc.save(makeReportFileName(currentViewedReport));
            } catch (error) {
                console.error("Report download failed:", error);
                alert("The report could not be downloaded. Please try again.");
            } finally {
                btn.innerHTML = originalHtml;
                btn.disabled = false;
            }
        }, 300);
    }// --- PWA SERVICE WORKER REGISTRATION ---
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
            .then(registration => {
                console.log('✅ Service Worker registered successfully with scope:', registration.scope);
            })
            .catch(error => {
                console.error('❌ Service Worker registration failed:', error);
            });
    });
}
</script>
